name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          flutter create . --org com.cashlifypos --project-name confectionery_distribution --platforms android
          rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get 2>&1 | tee ../ci-pubget.txt

      - name: Analyze
        id: analyze
        run: |
          set +e
          flutter --version > ../ci-analyze.txt 2>&1
          flutter analyze --no-fatal-infos --no-fatal-warnings >> ../ci-analyze.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat ../ci-analyze.txt

      - name: Build release APK
        id: build
        if: steps.analyze.outputs.code == '0'
        run: |
          set +e
          flutter build apk --release > ../ci-build.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          tail -n 200 ../ci-build.txt

      - name: Save CI logs to ci-logs branch
        if: always()
        working-directory: .
        run: |
          mkdir -p /tmp/ci && cp ci-*.txt /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci
          echo "run=${{ github.run_number }} sha=${{ github.sha }} analyze=${{ steps.analyze.outputs.code }} build=${{ steps.build.outputs.code }}" > RUN.txt
          git init -q -b ci-logs
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI logs run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - name: Stop if analyze / build failed
        if: steps.analyze.outputs.code != '0' || steps.build.outputs.code != '0'
        run: exit 1

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/ConfectioneryDistribution-${{ github.run_number }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ConfectioneryDistribution-${{ github.run_number }}
          path: app/build/ConfectioneryDistribution-${{ github.run_number }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: |
            Confectionery Distribution – Android APK (build ${{ github.run_number }}).
            Download the .apk on the phone and install (allow "Install unknown apps").
          files: app/build/ConfectioneryDistribution-${{ github.run_number }}.apk
